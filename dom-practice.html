
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Practice</title>
    <style>
        .highlight { background-color: yellow; }
        .container { padding: 20px; border: 1px solid #ccc; }
        .error { border: 2px solid red; }
        .completed { text-decoration: line-through; }
    </style>
</head>
<body>
    <header id="main-header">
        <h1>DOM Practice</h1>
        <nav>
            <ul class="nav-list">
                <li><a href="#" class="nav-link">Home</a></li>
                <li><a href="#" class="nav-link">About</a></li>
                <li><a href="#" class="nav-link">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <article>
            <h2 class="title">Article Title</h2>
            <p class="content">This is the first paragraph.</p>
            <p class="content">This is the second paragraph.</p>
        </article>

        <section>
            <h2>Form Section</h2>
            <form id="contact-form">
                <input type="text" id="name" name="name" placeholder="Name">
                <input type="email" id="email" name="email" placeholder="Email">
                <button type="submit">Submit</button>
            </form>
            <p id="form-message"></p>
        </section>
    </main>

    <section>
        <h2>Click Counter</h2>
        <p id="count">0</p>
        <button id="increase">+</button>
        <button id="decrease">-</button>
        <button id="reset">Reset</button>
    </section>

    <section>
        <h2>Delegated Task List</h2>
        <input id="practice-task" placeholder="Enter a task">
        <button id="add-practice-task">Add Task</button>
        <ul id="practice-list"></ul>
    </section>

    <footer>
        <p>&copy; 2026</p>
    </footer>

    <script src="dom.js"></script>
</body>
</html>
